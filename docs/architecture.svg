<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#333"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a7a63"/></marker>
  </defs>
  <rect width="1040" height="560" fill="#fff"/>

  <!-- front ends -->
  <rect x="20" y="40" width="150" height="54" rx="7" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.2"/>
  <text x="95" y="62" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Browser</text>
  <text x="95" y="79" text-anchor="middle" font-size="10.5" fill="#333">public/index.html</text>

  <rect x="20" y="118" width="150" height="54" rx="7" fill="#f6f2e8" stroke="#5a4a1f" stroke-width="1.2"/>
  <text x="95" y="140" text-anchor="middle" font-weight="bold" fill="#5a4a1f">Terminal</text>
  <text x="95" y="157" text-anchor="middle" font-size="10.5" fill="#333">src/cli/chat.js</text>

  <!-- server -->
  <rect x="215" y="68" width="150" height="76" rx="7" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="290" y="92" text-anchor="middle" font-weight="bold">HTTP routes</text>
  <text x="290" y="109" text-anchor="middle" font-size="10.5" fill="#333">src/server/index.js</text>
  <text x="290" y="126" text-anchor="middle" font-size="10" fill="#8a7a63">holds sessions</text>

  <line x1="170" y1="67" x2="213" y2="90" stroke="#333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>
  <line x1="170" y1="145" x2="213" y2="122" stroke="#333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>
  <text x="178" y="190" font-size="10" fill="#8a7a63">the CLI calls the engine directly</text>
  <path d="M95,172 L95,205 L455,205 L455,180" stroke="#8a7a63" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#ag)"/>

  <!-- controller -->
  <rect x="410" y="60" width="200" height="120" rx="8" fill="#fff" stroke="#333" stroke-width="1.9"/>
  <text x="510" y="84" text-anchor="middle" font-weight="bold">Dialogue controller</text>
  <text x="510" y="101" text-anchor="middle" font-size="10.5" fill="#333">src/engine/controller.js</text>
  <text x="510" y="122" text-anchor="middle" font-size="10.5" fill="#333">decides the kind of turn</text>
  <text x="510" y="138" text-anchor="middle" font-size="10.5" fill="#333">state machine + entry actions</text>
  <text x="510" y="159" text-anchor="middle" font-size="10" fill="#8a7a63">states.js defines the phases</text>

  <line x1="365" y1="106" x2="408" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>

  <!-- guardrails + matcher -->
  <rect x="410" y="210" width="95" height="64" rx="7" fill="#fdf0dc" stroke="#c17f3f" stroke-width="1.2"/>
  <text x="457" y="232" text-anchor="middle" font-weight="bold" font-size="11" fill="#7a4a1a">guardrails</text>
  <text x="457" y="248" text-anchor="middle" font-size="9.5" fill="#333">classify turn</text>
  <text x="457" y="262" text-anchor="middle" font-size="9.5" fill="#333">scan reply</text>

  <rect x="515" y="210" width="95" height="64" rx="7" fill="#f0f5ec" stroke="#5c7a52" stroke-width="1.2"/>
  <text x="562" y="232" text-anchor="middle" font-weight="bold" font-size="11" fill="#3f5738">matcher</text>
  <text x="562" y="248" text-anchor="middle" font-size="9.5" fill="#333">phrase to path</text>
  <text x="562" y="262" text-anchor="middle" font-size="9.5" fill="#333">deterministic</text>

  <line x1="457" y1="182" x2="457" y2="208" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="562" y1="182" x2="562" y2="208" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- context + prompts -->
  <rect x="660" y="60" width="175" height="76" rx="7" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="747" y="84" text-anchor="middle" font-weight="bold">Context builder</text>
  <text x="747" y="101" text-anchor="middle" font-size="10.5" fill="#333">src/engine/context.js</text>
  <text x="747" y="120" text-anchor="middle" font-size="10" fill="#b4762a">the public / secret boundary</text>

  <line x1="610" y1="98" x2="658" y2="98" stroke="#333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>

  <rect x="660" y="160" width="175" height="54" rx="7" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="747" y="182" text-anchor="middle" font-weight="bold" font-size="11">prompts/&lt;version&gt;/*.md</text>
  <text x="747" y="199" text-anchor="middle" font-size="10" fill="#8a7a63">v1 in use, v0 weakened</text>
  <line x1="747" y1="138" x2="747" y2="158" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- provider + api -->
  <rect x="880" y="60" width="140" height="76" rx="7" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="950" y="84" text-anchor="middle" font-weight="bold">LLM provider</text>
  <text x="950" y="101" text-anchor="middle" font-size="10.5" fill="#333">src/llm/provider.js</text>
  <text x="950" y="120" text-anchor="middle" font-size="10" fill="#8a7a63">anthropic | mock</text>
  <line x1="835" y1="98" x2="878" y2="98" stroke="#333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>

  <rect x="880" y="160" width="140" height="48" rx="7" fill="#f3f3f3" stroke="#888" stroke-width="1.1" stroke-dasharray="5,3"/>
  <text x="950" y="180" text-anchor="middle" font-size="11" fill="#333">Claude API</text>
  <text x="950" y="196" text-anchor="middle" font-size="9.5" fill="#8a7a63">external</text>
  <line x1="950" y1="138" x2="950" y2="158" stroke="#888" stroke-width="1.1" marker-end="url(#ag)"/>

  <!-- scenario store, the boundary -->
  <rect x="640" y="268" width="380" height="150" rx="9" fill="#faf7f0" stroke="#b4762a" stroke-width="1.4"/>
  <text x="830" y="291" text-anchor="middle" font-weight="bold" fill="#7a4a1a">scenarios/*.json  ·  src/engine/scenarios.js</text>

  <rect x="660" y="305" width="160" height="94" rx="7" fill="#f0f5ec" stroke="#5c7a52" stroke-width="1.2"/>
  <text x="740" y="326" text-anchor="middle" font-weight="bold" font-size="11" fill="#3f5738">public</text>
  <text x="740" y="344" text-anchor="middle" font-size="10" fill="#333">the request</text>
  <text x="740" y="359" text-anchor="middle" font-size="10" fill="#333">repo file tree</text>
  <text x="740" y="374" text-anchor="middle" font-size="10" fill="#333">conventions</text>
  <text x="740" y="391" text-anchor="middle" font-size="9.5" fill="#3f5738">publicView() · always safe</text>

  <rect x="840" y="305" width="160" height="94" rx="7" fill="#fdecec" stroke="#b5483c" stroke-width="1.2"/>
  <text x="920" y="326" text-anchor="middle" font-weight="bold" font-size="11" fill="#8c3328">secret</text>
  <text x="920" y="344" text-anchor="middle" font-size="10" fill="#333">the agent's plan</text>
  <text x="920" y="359" text-anchor="middle" font-size="10" fill="#333">the diff and hunks</text>
  <text x="920" y="374" text-anchor="middle" font-size="10" fill="#333">concepts, final check</text>
  <text x="920" y="391" text-anchor="middle" font-size="9.5" fill="#8c3328">secretView() · Phase 2 only</text>

  <path d="M747,214 L747,266" stroke="#5c7a52" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="738" y="245" font-size="10" fill="#3f5738" text-anchor="end">Phase 1: public only</text>

  <path d="M835,110 L860,110 L860,250 L920,250 L920,303" stroke="#b5483c" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="1016" y="243" font-size="10" fill="#8c3328" text-anchor="end">Phase 2 only, throws otherwise</text>

  <!-- session store -->
  <rect x="215" y="300" width="190" height="80" rx="7" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="310" y="323" text-anchor="middle" font-weight="bold">Session record</text>
  <text x="310" y="340" text-anchor="middle" font-size="10.5" fill="#333">src/engine/session.js</text>
  <text x="310" y="357" text-anchor="middle" font-size="10" fill="#8a7a63">unaided / hinted / revealed</text>
  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#8a7a63">data/sessions/&lt;id&gt;.json</text>
  <path d="M455,182 L455,250 L405,250 L405,320" stroke="#333" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- simulated agent -->
  <rect x="20" y="300" width="160" height="80" rx="7" fill="#f3f3f3" stroke="#888" stroke-width="1.1" stroke-dasharray="5,3"/>
  <text x="100" y="323" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Coding agent</text>
  <text x="100" y="340" text-anchor="middle" font-size="10" fill="#8a7a63">simulated in this build</text>
  <text x="100" y="357" text-anchor="middle" font-size="10" fill="#333">plan size, progress,</text>
  <text x="100" y="372" text-anchor="middle" font-size="10" fill="#333">approval, done</text>
  <path d="M180,330 L213,330" stroke="#888" stroke-width="1.1" marker-end="url(#ag)"/>
  <text x="196" y="398" font-size="10" fill="#8a7a63" text-anchor="middle">POST /api/session/:id/agent</text>

  <!-- footnote -->
  <text x="20" y="450" font-size="11" fill="#333" font-weight="bold">The one rule:</text>
  <text x="20" y="470" font-size="11" fill="#333">During Phase 1 the context builder reads the public half only, so the model is never given the plan or the diff. It cannot</text>
  <text x="20" y="487" font-size="11" fill="#333">disclose them early because it does not hold them. secretView() throws if called before the agent has finished, so a bug</text>
  <text x="20" y="504" font-size="11" fill="#333">that would cross the line stops the request instead of quietly producing a worse interaction.</text>
  <text x="20" y="530" font-size="11" fill="#8a7a63">No component writes to the learner's repository. There is no code path that does.</text>
</svg>
